name: Materialize implementation

on:
  push:
    branches: [feat/polymarket-us-agent-skill]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize verified tree
        run: |
          python - <<'PY'
          import base64
          import gzip
          import json
          from pathlib import Path

          parts = sorted(Path('.bootstrap').glob('payload-*.txt'))
          payload = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          data = json.loads(gzip.decompress(base64.b64decode(payload)))
          for name, content in data['files'].items():
              if name.startswith('.github/workflows/'):
                  continue
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
              mode = data['modes'].get(name)
              if mode:
                  path.chmod(mode)
          PY
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement Polymarket US agent skill"
          git push
