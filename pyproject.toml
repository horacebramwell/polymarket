[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-us-agent-skill"
version = "0.1.0"
description = "Portable Agent Skill and guarded CLI for Polymarket US"
requires-python = ">=3.10"
dependencies = [
  "polymarket-us>=1.0.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.4,<1",
]

[tool.pytest.ini_options]
testpaths = [".agents/skills/polymarket-us/tests", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.setuptools]
packages = []
